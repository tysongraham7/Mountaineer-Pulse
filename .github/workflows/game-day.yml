name: Game Day Alerts

# Kickoff reminders and final scores. Runs every 10 minutes because a game ends when it
# ends — a half-hourly check would deliver a final up to 30 minutes late, which for the
# one alert people most want is the difference between useful and pointless.
#
# Cheap enough to justify that: no Claude call at all, just a couple of indexed queries
# against games, and it exits in seconds when nothing is due (most of the year, always).
# The repo is public, so Actions minutes are free.
on:
  schedule:
    # Every 30 minutes, and only 14:00-04:00 UTC (10am-midnight ET).
    #
    # This asked for every 10 minutes round the clock — 144 dispatches a day — and GitHub
    # answered by throttling the whole repository. Measured over five days it delivered 4.8
    # of those 144 runs, 3%, and dragged everything else down with it: the breaking scan got
    # 43% of its runs, bug alerts 53%, and the daily pipeline slipped from 30 minutes late to
    # ten HOURS late. Across all workflows the repo was getting 8% of what it asked for.
    #
    # A cron that fires 144 times a day to serve roughly 100 game days a year was always poor
    # value; it turned out to cost the reliability of every other job as well. 30 runs a day
    # is a request GitHub will actually honour.
    #
    # The window starts at 14:00 UTC because the earliest realistic kickoff is noon ET
    # (16:00 UTC) and the reminder needs to fire 90 minutes ahead of it.
    #
    # Cost: a final score now lands within ~30 minutes instead of ~10. That is the right
    # trade — a 30-minute-late alert that arrives beats a 10-minute one that never does.
    - cron: "*/30 14-23,0-4 * * *"
  workflow_dispatch:

# A run that overlaps the previous one could send the same alert twice before the first
# has stamped the row. Never cancel-in-progress here — a half-finished send is worse than
# a skipped tick, and the next tick is only ten minutes out.
concurrency:
  group: game-day-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # notify_games.py needs only these three; the full requirements.txt would add a
      # minute to a job that usually has nothing to do.
      - name: Install dependencies
        run: pip install requests supabase python-dotenv

      # CFBD_API_KEY is here because a live game triggers a score refresh from inside the
      # script — the daily sync is far too slow to catch a final while it's still news.
      - name: Kickoff reminders and final scores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python notify_games.py
